/* IDENTITÉ GRAPHIQUE */

:root {

body {

}

figure {
  max-width: 650px;
  margin: 0 auto 45px;
}

figure img {

  height: auto;

  border: 1px solid #a59a87;

figcaption {

}

.source-photo a {

}

.dossiers {
  display: grid;
  gap: 15px;

  max-width: 650px;
  margin: 0 auto;
}

.cartouche {
  display: flex;
  justify-content: space-between;
  align-items: center;

  min-height: 80px;
  padding: 20px 28px;

  background: var(--blanc);
  border: 1px solid var(--trait);

  color: var(--encre);
  text-decoration: none;

  transition:
    background .15s ease,
    border-color .15s ease;
}

.cartouche:hover {
  background: #eee3cb;
  border-color: var(--brun);
}

.cartouche strong {
  font-size: 28px;
  font-weight: 500;
  line-height: 1.2;
}

.fleche {
  flex-shrink: 0;
  margin-left: 15px;

  color: var(--brun);
  font-size: 25px;
}

/* RETOUR */

footer {
  max-width: 650px;
  margin: 55px auto 0;
  padding-top: 20px;

  border-top: 1px solid var(--trait);
  font-size: 17px;
}

footer a {
  color: var(--bleu);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

a:focus-visible {
  outline: 2px solid var(--bleu);
  outline-offset: 4px;
}

/* MOBILE */

@media (max-width: 600px) {

  body {

  figcaption {
