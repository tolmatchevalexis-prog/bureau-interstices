<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ded3b8">

<title>Les Murmures de l’Alma — Acte I</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Special+Elite&display=swap" rel="stylesheet">

<style>

/* ========================================
   PAPIER ET TYPOGRAPHIE
======================================== */

:root {
  --papier: #ded3b8;
  --feuille: #f3e9cf;
  --encre: #292920;
  --trait: #b4a58b;
  --brun: #68352d;
  --bleu: #24374f;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 18px;

  color: var(--encre);

  font: 21px/1.7
    "EB Garamond",
    Garamond,
    Georgia,
    serif;

  background:
    radial-gradient(
      ellipse at 15% 12%,
      #fff7df80,
      transparent 48%
    ),
    var(--papier);
}

/* Grain discret */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .09;

  background-image: url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.68' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E"
  );
}

/* ========================================
   FEUILLE
======================================== */

.page {
  width: min(880px, 100%);
  margin: 25px auto 60px;
  padding: clamp(26px, 7vw, 78px);

  background: var(--feuille);
  border: 1px solid var(--trait);
  box-shadow: 7px 10px 0 #c7ba9e;
}

/* ========================================
   EN-TÊTE
======================================== */

header {
  text-align: center;
  padding-bottom: 36px;
  margin-bottom: 38px;
  border-bottom: 1px solid var(--trait);
}

.kicker {
  font: 12px/1.7
    "Special Elite",
    "Courier New",
    monospace;

  color: #60594d;
}

h1 {
  margin: 14px 0;
  font-size: clamp(40px, 7vw, 63px);
  font-weight: 500;
  line-height: 1.1;
}

.subtitle {
  font-size: 23px;
  font-style: italic;
}

/* ========================================
   SOMMAIRE
======================================== */

nav {
  max-width: 670px;
  margin: 0 auto 58px;

  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

nav a {
  padding: 7px 11px;
  border: 1px solid var(--trait);

  font: 12px/1.6
    "Special Elite",
    "Courier New",
    monospace;

  color: var(--bleu);
  text-decoration: none;
}

nav a:hover {
  background: #fffaf0;
}

/* ========================================
   SCÈNES
======================================== */

.scene {
  max-width: 670px;
  margin: 0 auto 85px;
  scroll-margin-top: 25px;
}

.scene h2 {
  margin: 0 0 22px;

  font-size: clamp(30px, 5vw, 42px);
  line-height: 1.2;
  font-weight: 500;
}

.lieu {
  margin: 0 0 32px;
  font-size: 18px;
  font-style: italic;
  color: #665c50;
}

/* ========================================
   LES QUATRE REGISTRES
======================================== */

.registre {
  margin: 0 0 24px;
}

/* AMBIANCE — prose littéraire */

.ambiance {
  color: var(--encre);
  font-size: 21px;
  line-height: 1.72;
}

/* INFORMATION — indications de jeu */

.information {
  margin-left: 12px;
  color: var(--encre);
  font-size: 20px;
  line-height: 1.62;
}

/* NARRATEUR — informations confidentielles */

.narrateur {
  margin: 34px 0 38px 16px;
  padding: 5px 0 7px 25px;

  border-left: 2px solid var(--brun);

  color: var(--brun);
  font-size: 19px;
  line-height: 1.63;
}

/* MISE — système M.I.S.E. */

.mise {
  margin: 32px 0 38px 16px;
  padding: 8px 0 8px 25px;

  border-left: 2px solid var(--bleu);

  color: var(--bleu);
  font-size: 18px;
  line-height: 1.6;
}

/* ========================================
   PARAGRAPHES
======================================== */

.registre p {
  margin: 0 0 1.08em;
  hyphens: auto;
  overflow-wrap: break-word;
}

/* ========================================
   TOUS LES DIALOGUES EN ITALIQUE
======================================== */

.registre .dialogue {
  margin-left: 20px;
  margin-right: 8px;

  font-style: italic;
  text-align: left;
}

/* Les dialogues conservent la couleur
   de leur registre. */

.ambiance .dialogue,
.information .dialogue {
  color: var(--encre);
}

.narrateur .dialogue {
  color: var(--brun);
}

.mise .dialogue {
  color: var(--bleu);
}

/* ========================================
   TITRES INTERNES
======================================== */

.registre h3 {
  margin: 34px 0 18px;
  font-size: 25px;
  font-weight: 600;
  line-height: 1.25;
}

.registre h4 {
  margin: 28px 0 14px;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.3;
}

.registre h3:first-child,
.registre h4:first-child {
  margin-top: 0;
}

.narrateur h3,
.narrateur h4 {
  color: var(--brun);
}

.mise h3,
.mise h4 {
  color: var(--bleu);
}

/* ========================================
   LISTES
======================================== */

.registre ul {
  margin: 16px 0 26px;
  padding-left: 24px;
}

.registre li {
  margin-bottom: 10px;
  line-height: 1.55;
}

/* ========================================
   ÉPILOGUE
======================================== */

.epilogue {
  margin-top: 90px;
  padding-top: 32px;
  border-top: 1px solid var(--trait);
}

.epilogue h2 {
  color: var(--brun);
}

/* ========================================
   NAVIGATION
======================================== */

footer {
  max-width: 670px;
  margin: 65px auto 0;
  padding-top: 22px;
  border-top: 1px solid var(--trait);
  font-size: 17px;
}

footer a {
  color: var(--bleu);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

a:focus-visible {
  outline: 2px solid var(--bleu);
  outline-offset: 4px;
}

.erreur {
  max-width: 670px;
  margin: 0 auto;

  color: var(--brun);
  font-style: italic;
}

/* ========================================
   VERSION MOBILE
======================================== */

@media (max-width: 600px) {

  body {
    padding: 10px;
    font-size: 19px;
    line-height: 1.62;
  }

  .page {
    padding: 30px 20px;
    margin: 10px auto 35px;
    box-shadow: 4px 6px 0 #c7ba9e;
  }

  .ambiance {
    font-size: 19px;
  }

  .information {
    margin-left: 5px;
    font-size: 18px;
  }

  .narrateur {
    margin-left: 3px;
    padding-left: 16px;
    font-size: 18px;
  }

  .mise {
    margin-left: 3px;
    padding-left: 16px;
    font-size: 17px;
  }

  .registre .dialogue {
    margin-left: 12px;
  }

  .registre h3 {
    font-size: 23px;
  }

  .registre h4 {
    font-size: 20px;
  }

}

/* ========================================
   IMPRESSION
======================================== */

@media print {

  body {
    padding: 0;
    background: white;
  }

  body::before {
    display: none;
  }

  .page {
    width: 100%;
    margin: 0;
    padding: 15mm;
    border: 0;
    box-shadow: none;
  }

  nav,
  footer {
    display: none;
  }

  .scene {
    break-before: page;
  }

}

</style>

</head>

<body>

<main class="page">

<header>

<p class="kicker">
BUREAU DES INTERSTICES · AFFAIRE I
</p>

<h1>Les Murmures de l’Alma</h1>

<p class="subtitle">
Acte I · Paris, automne 1966
</p>

</header>

<!-- SOMMAIRE -->

<nav
  id="sommaire"
  aria-label="Sommaire de l'acte">
</nav>

<!-- TEXTE DU SCÉNARIO -->

<article
  id="manuscrit"
  aria-label="Texte intégral de l'acte I">

<p>Ouverture du manuscrit…</p>

</article>

<!-- RETOUR -->

<footer>

<a href="sce1-murmures.html">
← Retour aux trois actes
</a>

</footer>

</main>

<script>

(async function () {

  /* =====================================
     FICHIER SOURCE
  ===================================== */

  const FICHIER =
    "Murmures_Alma_Acte_1_site.txt";

  const manuscrit =
    document.getElementById("manuscrit");

  const sommaire =
    document.getElementById("sommaire");

  const REGISTRES = {
    AMBIANCE: "ambiance",
    INFORMATION: "information",
    NARRATEUR: "narrateur",
    MISE: "mise"
  };

  /* =====================================
     CRÉATION SÉCURISÉE DES ÉLÉMENTS
  ===================================== */

  function creer(tag, texte, classe) {

    const el = document.createElement(tag);

    if (classe) {
      el.className = classe;
    }

    if (texte !== undefined) {
      el.textContent = texte;
    }

    return el;
  }

  /* =====================================
     RECONNAISSANCE DES STRUCTURES
  ===================================== */

  function estScene(texte) {
    return /^SCÈNE\s+\d+\s+—/.test(texte);
  }

  function estPrelude(texte) {
    return /^PRÉLUDE\s+—/.test(texte);
  }

  function estEpilogue(texte) {
    return /^ÉPILOGUE\s+—/.test(texte);
  }

  function estSeparateur(texte) {
    return /^={10,}$/.test(texte);
  }

  function estDialogue(texte) {
    return /^[—–]\s*/.test(texte);
  }

  function estTitrePrincipal(texte) {

    return (
      texte === "INTRODUCTION" ||
      texte === "INTRODUCTION AUX PERSONNAGES JOUEURS" ||
      texte === "RÉSERVÉ AU NARRATEUR" ||
      texte === "LES LIEUX ET LES INVESTIGATIONS" ||
      texte === "ÉVOLUTIONS POSSIBLES DE LA SCÈNE" ||
      texte === "SORTIE DE SCÈNE" ||
      texte.startsWith("M.I.S.E. —") ||
      texte === "UNE PRÉSENCE SUR L'AUTRE RIVE" ||
      texte === "LE RENARD"
    );
  }

  function estTitreNumerote(texte) {

    return (
      /^\d+\.\s+/.test(texte) &&
      texte.length < 110
    );
  }

  function estTitreMajuscules(texte) {

    return (
      texte.length > 4 &&
      texte.length < 110 &&
      texte === texte.toUpperCase() &&
      /[A-ZÀ-ÖØ-Ý]/.test(texte) &&
      !estDialogue(texte) &&
      !texte.startsWith("- ") &&
      !texte.startsWith("«")
    );
  }

  function estPetitTitre(texte) {

    if (texte.length > 75) return false;
    if (estDialogue(texte)) return false;
    if (texte.startsWith("- ")) return false;
    if (texte.startsWith("«")) return false;
    if (/[.!?;»]$/.test(texte)) return false;

    if (texte.split(/\s+/).length > 9) {
      return false;
    }

    return true;
  }

  /* =====================================
     CHARGEMENT DU MANUSCRIT
  ===================================== */

  try {

    const reponse = await fetch(
      FICHIER,
      { cache: "no-cache" }
    );

    if (!reponse.ok) {
      throw new Error("Manuscrit introuvable");
    }

    const contenu = await reponse.text();

    const lignes = contenu
      .replace(/^\uFEFF/, "")
      .replace(/\r\n?/g, "\n")
      .split("\n");

    manuscrit.replaceChildren();

    /* État de lecture */

    let scene = null;
    let section = null;
    let liste = null;

    let registreActuel = "AMBIANCE";
    let attenteLieu = false;

    let compteurScenes = 0;

    /* ===================================
       SOMMAIRE
    =================================== */

    function ajouterSommaire(
      texte,
      identifiant
    ) {

      const lien = creer("a", texte);

      lien.href = "#" + identifiant;

      sommaire.appendChild(lien);
    }

    /* ===================================
       NOUVELLE SCÈNE
    =================================== */

    function nouvelleScene(
      titre,
      identifiant,
      etiquette,
      epilogue = false
    ) {

      scene = creer(
        "section",
        undefined,
        epilogue ? "scene epilogue" : "scene"
      );

      scene.id = identifiant;

      scene.appendChild(
        creer("h2", titre)
      );

      manuscrit.appendChild(scene);

      ajouterSommaire(
        etiquette,
        identifiant
      );

      section = null;
      liste = null;

      registreActuel =
        epilogue ? "NARRATEUR" : "AMBIANCE";

      attenteLieu = !epilogue;
    }

    /* ===================================
       CHANGEMENT DE REGISTRE
    =================================== */

    function changerRegistre(nom) {

      registreActuel = nom;
      liste = null;

      if (!scene) {
        section = null;
        return;
      }

      section = creer(
        "div",
        undefined,
        "registre " + REGISTRES[nom]
      );

      scene.appendChild(section);
    }

    /* ===================================
       AJOUT DE PARAGRAPHE
    =================================== */

    function ajouterParagraphe(
      texte,
      classe = ""
    ) {

      if (!section) {
        changerRegistre(registreActuel);
      }

      section.appendChild(
        creer("p", texte, classe)
      );

      liste = null;
    }

    /* ===================================
       TITRES
    =================================== */

    function ajouterTitre(
      texte,
      niveau
    ) {

      if (!section) {
        changerRegistre(registreActuel);
      }

      section.appendChild(
        creer(niveau, texte)
      );

      liste = null;
    }

    /* ===================================
       LISTES
    =================================== */

    function ajouterListe(texte) {

      if (!section) {
        changerRegistre(registreActuel);
      }

      if (!liste) {
        liste = creer("ul");
        section.appendChild(liste);
      }

      liste.appendChild(
        creer("li", texte.slice(2))
      );
    }

    /* ===================================
       LIEU ET DATE
    =================================== */

    function ajouterLieu(texte) {

      scene.appendChild(
        creer("p", texte, "lieu")
      );

      attenteLieu = false;
    }

    /* ===================================
       TRAITEMENT DU TEXTE
    =================================== */

    function traiterTexte(texteBrut) {

      const texte = texteBrut.trim();

      if (!texte) {
        liste = null;
        return;
      }

      /* Séparateurs */

      if (estSeparateur(texte)) {
        liste = null;
        return;
      }

      /* En-tête déjà affiché */

      if (
        texte === "LES MURMURES DE L'ALMA" ||
        texte === "LES MURMURES DE L’ALMA" ||
        texte === "AFFAIRE I — ACTE I" ||
        texte === "Affaire I — Acte I"
      ) {
        return;
      }

      /* Prélude */

      if (estPrelude(texte)) {

        nouvelleScene(
          texte,
          "prelude",
          "Prélude"
        );

        return;
      }

      /* Scènes numérotées */

      if (estScene(texte)) {

        compteurScenes++;

        nouvelleScene(
          texte,
          "scene-" + compteurScenes,
          "Scène " + compteurScenes
        );

        return;
      }

      /* Épilogue */

      if (estEpilogue(texte)) {

        nouvelleScene(
          texte,
          "epilogue",
          "Épilogue",
          true
        );

        return;
      }

      if (!scene) {
        return;
      }

      /* Lieu et date */

      if (attenteLieu) {

        ajouterLieu(texte);

        return;
      }

      /* Ouverture d'un registre par défaut */

      if (!section) {
        changerRegistre(registreActuel);
      }

      /* Titres principaux */

      if (estTitrePrincipal(texte)) {

        ajouterTitre(texte, "h3");

        return;
      }

      /* Rubriques numérotées */

      if (estTitreNumerote(texte)) {

        ajouterTitre(texte, "h3");

        return;
      }

      /* Titres en capitales */

      if (estTitreMajuscules(texte)) {

        ajouterTitre(texte, "h3");

        return;
      }

      /* Listes */

      if (texte.startsWith("- ")) {

        ajouterListe(texte);

        return;
      }

      /* =================================
         DIALOGUES : ITALIQUES

         Fonctionne dans les quatre
         registres du manuscrit.
      ================================= */

      if (estDialogue(texte)) {

        ajouterParagraphe(
          texte,
          "dialogue"
        );

        return;
      }

      /* Intertitres courts des sections
         non littéraires */

      if (
        registreActuel !== "AMBIANCE" &&
        estPetitTitre(texte)
      ) {

        ajouterTitre(texte, "h4");

        return;
      }

      /* Paragraphes ordinaires */

      ajouterParagraphe(texte);
    }

    /* ===================================
       LECTURE DES BALISES

       [AMBIANCE]
       [INFORMATION]
       [NARRATEUR]
       [MISE]

       Elles servent à la composition
       mais ne sont jamais affichées.
    =================================== */

    const expressionBalises =
      /\[(AMBIANCE|INFORMATION|NARRATEUR|MISE)\]/g;

    for (const ligne of lignes) {

      expressionBalises.lastIndex = 0;

      let debut = 0;
      let resultat;

      while (
        (resultat =
          expressionBalises.exec(ligne)) !== null
      ) {

        /* Texte avant la balise */

        const avant = ligne.slice(
          debut,
          resultat.index
        );

        traiterTexte(avant);

        /* Nouveau registre */

        changerRegistre(resultat[1]);

        debut = expressionBalises.lastIndex;
      }

      /* Texte après la dernière balise */

      traiterTexte(
        ligne.slice(debut)
      );
    }

    /* Contrôle indicatif */

    if (compteurScenes !== 6) {

      console.warn(
        "Scènes reconnues :",
        compteurScenes,
        "— six attendues."
      );
    }

  }

  catch (erreur) {

    manuscrit.replaceChildren();

    manuscrit.appendChild(
      creer(
        "p",
        "Le manuscrit n'a pas pu être ouvert. Vérifiez que Murmures_Alma_Acte_1_site.txt se trouve à la racine du dépôt GitHub.",
        "erreur"
      )
    );
  }

})();

</script>

</body>
</html>
