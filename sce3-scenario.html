
<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ded3b8">

<title>À la claire fontaine — Scénario — Bureau des Interstices</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Special+Elite&display=swap"
rel="stylesheet">

<style>

/* ==========================================
   BUREAU DES INTERSTICES
   LECTEUR DE SCÉNARIO
========================================== */

:root {
  --papier:#ded3b8;
  --feuille:#f3e9cf;
  --encre:#292920;
  --trait:#b4a58b;
  --brun:#68352d;
  --bleu:#24374f;
  --gris:#665c50;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  padding:18px;
  background:var(--papier);
  color:var(--encre);

  font:21px/1.7
    "EB Garamond",
    Garamond,
    Georgia,
    serif;
}

.page {
  width:min(880px,100%);
  margin:25px auto 60px;
  padding:clamp(26px,7vw,78px);

  background:var(--feuille);
  border:1px solid var(--trait);
  box-shadow:7px 10px 0 #c7ba9e;
}

/* EN-TÊTE */

header {
  text-align:center;
  padding-bottom:35px;
  margin-bottom:36px;
  border-bottom:1px solid var(--trait);
}

.reference {
  margin:0;
  color:var(--gris);

  font:12px/1.7
    "Special Elite",
    "Courier New",
    monospace;
}

h1 {
  margin:17px 0 12px;
  font-size:clamp(39px,7vw,62px);
  font-weight:500;
  line-height:1.15;
}

.sous-titre {
  margin:0 0 10px;
  font-size:23px;
  font-style:italic;
}

.date {
  margin:0;
  font-size:17px;
  color:var(--gris);
}

/* SOMMAIRE */

.sommaire {
  max-width:690px;
  margin:0 auto 55px;
}

.sommaire-titre {
  margin:0 0 17px;
  color:var(--gris);

  font:12px/1.6
    "Special Elite",
    "Courier New",
    monospace;
}

.sommaire-liens {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.sommaire-liens a {
  display:block;
  padding:12px;
  border:1px solid var(--trait);
  text-decoration:none;
  color:var(--bleu);

  font:12px/1.6
    "Special Elite",
    "Courier New",
    monospace;
}

.sommaire-liens a:hover {
  background:#fffaf0;
}

/* SCÈNES */

.scene,
.introduction,
.epilogue {
  max-width:690px;
  margin:0 auto 80px;
  scroll-margin-top:24px;
}

.scene {
  padding-top:10px;
}

.scene h2 {
  margin:0 0 18px;
  font-size:clamp(30px,5vw,42px);
  font-weight:500;
  line-height:1.2;
}

.localisation {
  margin:0 0 30px;
  font-size:18px;
  font-style:italic;
  color:var(--gris);
}

/* LES QUATRE REGISTRES */

.registre {
  margin:0 0 30px;
}

/* AMBIANCE LITTÉRAIRE */

.ambiance {
  color:var(--encre);
  font-size:21px;
  line-height:1.72;
}

/* INFORMATION DE JEU */

.information {
  margin-left:12px;
  color:var(--encre);
  font-size:20px;
  line-height:1.65;
}

/* RÉSERVÉ AU NARRATEUR */

.narrateur {
  margin:34px 0 36px 16px;
  padding:5px 0 7px 25px;

  border-left:2px solid var(--brun);
  color:var(--brun);

  font-size:19px;
  line-height:1.65;
}

/* M.I.S.E. */

.mise {
  margin:34px 0 36px 16px;
  padding:8px 0 8px 25px;

  border-left:2px solid var(--bleu);
  color:var(--bleu);

  font-size:18px;
  line-height:1.62;
}

/* PARAGRAPHES */

.registre p {
  margin:0 0 1.05em;
  hyphens:auto;
  overflow-wrap:break-word;
}

/* DIALOGUES */

.registre p.dialogue {
  margin-left:20px;
  margin-right:8px;
  font-style:italic;
}

/* INTERTITRES */

.registre h3 {
  margin:30px 0 17px;
  font-size:25px;
  font-weight:600;
  line-height:1.3;
}

.registre h3:first-child {
  margin-top:0;
}

.narrateur h3 {
  color:var(--brun);
}

.mise h3 {
  color:var(--bleu);
}

/* SOUS-TITRES COURTS */

.registre h4 {
  margin:24px 0 12px;
  font-size:21px;
  font-weight:600;
}

/* ÉPILOGUE */

.epilogue {
  padding-top:35px;
  border-top:1px solid var(--trait);
}

.epilogue h2 {
  font-size:32px;
  font-weight:500;
}

.fin-scenario {
  max-width:690px;
  margin:60px auto 0;
  padding-top:25px;

  border-top:1px solid var(--trait);
  text-align:center;
  color:var(--brun);

  font:14px/1.7
    "Special Elite",
    monospace;
}

/* NAVIGATION */

footer {
  max-width:690px;
  margin:65px auto 0;
  padding-top:22px;
  border-top:1px solid var(--trait);
  font-size:17px;
}

footer a {
  display:block;
  margin:0 0 12px;
  color:var(--bleu);
  text-decoration:none;
}

footer a:hover {
  text-decoration:underline;
}

.retour-sommaire {
  display:block;
  margin:30px 0 0;
  color:var(--bleu);
  font:12px/1.6 "Special Elite",monospace;
  text-decoration:none;
}

.etat {
  max-width:690px;
  margin:0 auto;
  color:var(--gris);
  font-style:italic;
}

a:focus-visible {
  outline:2px solid var(--bleu);
  outline-offset:4px;
}

/* MOBILE */

@media(max-width:600px) {

  body {
    padding:10px;
  }

  .page {
    margin:10px auto 35px;
    padding:30px 20px;
    box-shadow:4px 6px 0 #c7ba9e;
  }

  .sommaire-liens {
    grid-template-columns:1fr;
  }

  .ambiance {
    font-size:19px;
  }

  .information {
    margin-left:5px;
    font-size:18px;
  }

  .narrateur {
    margin-left:3px;
    padding-left:16px;
    font-size:18px;
  }

  .mise {
    margin-left:3px;
    padding-left:16px;
    font-size:17px;
  }

  .registre p.dialogue {
    margin-left:12px;
  }

  .registre h3 {
    font-size:22px;
  }

}

/* IMPRESSION */

@media print {

  body {
    background:white;
    padding:0;
  }

  .page {
    width:100%;
    margin:0;
    padding:15mm;
    border:0;
    box-shadow:none;
  }

  .sommaire,
  footer,
  .retour-sommaire {
    display:none;
  }

  .scene {
    break-before:page;
  }

}

</style>
</head>

<body>

<main class="page">

<!-- EN-TÊTE -->

<header id="haut">

  <p class="reference">
    BUREAU DES INTERSTICES · SCÉNARIO 03
  </p>

  <h1>À la claire fontaine</h1>

  <p class="sous-titre">
    Scénario complet — Dix scènes
  </p>

  <p class="date">
    Finistère, monts d'Arrée<br>
    Du mardi 12 au dimanche 17 octobre 1965
  </p>

</header>


<!-- SOMMAIRE -->

<nav
  id="sommaire"
  class="sommaire"
  aria-label="Sommaire du scénario">

  <p class="sommaire-titre">
    TABLE DES SCÈNES
  </p>

  <div
    id="sommaire-liens"
    class="sommaire-liens">
  </div>

</nav>


<!-- MANUSCRIT -->

<article
  id="manuscrit"
  aria-label="Texte intégral du scénario">

  <p class="etat">
    Ouverture du dossier…
  </p>

</article>


<!-- NAVIGATION -->

<footer>

  <a href="sce3-fontaine.html">
    ← Retour au dossier À la claire fontaine
  </a>

  <a href="sce3-annexes.html">
    Consulter les annexes
  </a>

  <a href="#haut">
    ↑ Retour au début
  </a>

</footer>

</main>


<script>

(async function () {

  /* =====================================
     SOURCE DU MANUSCRIT
  ===================================== */

  const FICHIER =
    "Claire_fontaine_scen_site.txt";

  const manuscrit =
    document.getElementById("manuscrit");

  const sommaire =
    document.getElementById("sommaire-liens");

  /* =====================================
     OUTILS DE CRÉATION

     Aucun texte source n'est interprété
     comme du code HTML.
  ===================================== */

  function creer(type,texte,classe) {

    const element =
      document.createElement(type);

    if(classe) {
      element.className = classe;
    }

    if(texte !== undefined) {
      element.textContent = texte;
    }

    return element;
  }

  /* =====================================
     RECONNAISSANCE
  ===================================== */

  function estSeparateur(texte) {
    return /^[─=]{3,}$/.test(texte);
  }

  function estScene(texte) {
    return /^SCÈNE\s+\d+\s+—/.test(texte);
  }

  function estDialogue(texte) {
    return /^[—–]\s*/.test(texte);
  }

  function estTitreMajuscules(texte) {

    return (
      texte.length > 3 &&
      texte.length < 125 &&
      texte === texte.toUpperCase() &&
      /[A-ZÀ-ÖØ-Ý]/.test(texte) &&
      !estDialogue(texte) &&
      !texte.startsWith("•")
    );

  }

  function numeroScene(texte) {

    const resultat =
      texte.match(/^SCÈNE\s+(\d+)/);

    return resultat ?
      Number(resultat[1]) :
      null;

  }

  function registrePourTitre(texte) {

    const normalise =
      texte.toUpperCase();

    if (
      normalise.startsWith(
        "RÉSERVÉ AU NARRATEUR"
      ) ||
      normalise.startsWith(
        "HORS JEU"
      )
    ) {
      return "narrateur";
    }

    if (
      normalise.startsWith("M.I.S.E.")
    ) {
      return "mise";
    }

    if (
      normalise.startsWith("INFORMATIONS") ||
      normalise.startsWith("DOCUMENTS ACCESSIBLES") ||
      normalise.startsWith("SORTIE DE SCÈNE")
    ) {
      return "information";
    }

    return "ambiance";

  }

  /* =====================================
     CHARGEMENT
  ===================================== */

  try {

    const reponse = await fetch(
      FICHIER,
      {cache:"no-cache"}
    );

    if(!reponse.ok) {
      throw new Error(
        "Fichier TXT introuvable."
      );
    }

    const contenu = await reponse.text();

    const lignes = contenu
      .replace(/^\uFEFF/,"")
      .replace(/\r\n?/g,"\n")
      .split("\n");

    manuscrit.replaceChildren();

    /* ===================================
       ÉTAT DE LECTURE
    =================================== */

    let conteneur = manuscrit;
    let section = null;

    let registreActuel = "ambiance";

    let attenteLieu = false;

    let sceneActuelle = null;
    let compteurScenes = 0;

    /* ===================================
       CHANGEMENT DE REGISTRE
    =================================== */

    function changerRegistre(nom) {

      registreActuel = nom;

      section = creer(
        "div",
        undefined,
        "registre " + nom
      );

      conteneur.appendChild(section);

    }

    function assurerRegistre() {

      if(!section) {
        changerRegistre(registreActuel);
      }

    }

    /* ===================================
       TITRES ET PARAGRAPHES
    =================================== */

    function ajouterTitre(texte) {

      assurerRegistre();

      section.appendChild(
        creer("h3",texte)
      );

    }

    function ajouterParagraphe(texte) {

      assurerRegistre();

      const classe =
        estDialogue(texte) ?
        "dialogue" :
        "";

      section.appendChild(
        creer("p",texte,classe)
      );

    }

    /* ===================================
       NOUVELLE SCÈNE
    =================================== */

    function nouvelleScene(titre) {

      const numero = numeroScene(titre);

      compteurScenes++;

      const scene = creer(
        "section",
        undefined,
        "scene"
      );

      scene.id = "scene-" + numero;

      scene.appendChild(
        creer("h2",titre)
      );

      manuscrit.appendChild(scene);

      conteneur = scene;
      sceneActuelle = scene;

      section = null;
      registreActuel = "ambiance";
      attenteLieu = true;

      /* Sommaire */

      const lien = creer(
        "a",
        titre
      );

      lien.href = "#" + scene.id;

      sommaire.appendChild(lien);

    }

    /* ===================================
       INTRODUCTION
    =================================== */

    function ouvrirIntroduction() {

      const intro = creer(
        "section",
        undefined,
        "introduction"
      );

      manuscrit.appendChild(intro);

      conteneur = intro;

      section = null;
      registreActuel = "narrateur";

    }

    ouvrirIntroduction();

    /* ===================================
       ÉPILOGUE
    =================================== */

    function ouvrirEpilogue(titre) {

      const epilogue = creer(
        "section",
        undefined,
        "epilogue"
      );

      epilogue.id = "epilogue";

      epilogue.appendChild(
        creer("h2",titre)
      );

      manuscrit.appendChild(epilogue);

      conteneur = epilogue;
      section = null;

      registreActuel = "ambiance";
      attenteLieu = false;

      const lien = creer(
        "a",
        "Épilogue"
      );

      lien.href = "#epilogue";

      sommaire.appendChild(lien);

    }

    /* ===================================
       TRAITEMENT DES LIGNES
    =================================== */

    function traiterLigne(ligne) {

      const texte = ligne.trim();

      if(!texte) {
        return;
      }

      if(estSeparateur(texte)) {
        return;
      }

      /* Titre déjà affiché dans
         l'en-tête de la page */

      if(
        texte === "À LA CLAIRE FONTAINE" ||
        texte ===
        "Finistère, monts d'Arrée — Du mardi 12 au dimanche 17 octobre 1965."
      ) {
        return;
      }

      /* Ouverture d'une scène */

      if(estScene(texte)) {
        nouvelleScene(texte);
        return;
      }

      /* Lieu et date immédiatement
         après le titre de la scène */

      if(attenteLieu && sceneActuelle) {

        conteneur.appendChild(
          creer(
            "p",
            texte,
            "localisation"
          )
        );

        attenteLieu = false;
        return;

      }

      /* Épilogue */

      if(
        /^ÉPILOGUE POSSIBLE\s+—/.test(texte)
      ) {
        ouvrirEpilogue(texte);
        return;
      }

      /* Mention finale */

      if(
        /^FIN DU SCÉNARIO\s*\.?$/.test(texte)
      ) {

        manuscrit.appendChild(
          creer(
            "p",
            texte,
            "fin-scenario"
          )
        );

        return;

      }

      /* Rubriques principales :
         changement de registre */

      if(
        estTitreMajuscules(texte) &&
        (
          texte.startsWith("RÉSERVÉ AU NARRATEUR") ||
          texte.startsWith("M.I.S.E.") ||
          texte.startsWith("INFORMATIONS") ||
          texte.startsWith("SORTIE DE SCÈNE") ||
          texte.startsWith("HORS JEU")
        )
      ) {

        changerRegistre(
          registrePourTitre(texte)
        );

        ajouterTitre(texte);
        return;

      }

      /* Intertitres du manuscrit */

      if(estTitreMajuscules(texte)) {

        /* L'intertitre démarre une
           nouvelle séquence littéraire
           si le registre précédent était
           réservé au Narrateur ou à M.I.S.E. */

        if(
          registreActuel === "narrateur" ||
          registreActuel === "mise" ||
          registreActuel === "information"
        ) {
          changerRegistre("ambiance");
        }

        ajouterTitre(texte);
        return;

      }

      /* Intertitres secondaires
         présents en casse mixte.
         Leur texte reste inchangé. */

      if(
        /^Réservé au Narrateur\s+—/.test(texte)
      ) {

        changerRegistre("narrateur");
        section.appendChild(
          creer("h4",texte)
        );

        return;

      }

      /* Paragraphes, dialogues,
         didascalies et indications
         conservés tels quels */

      ajouterParagraphe(texte);

    }

    /* ===================================
       INTERPRÉTATION DU TXT
    =================================== */

    for(const ligne of lignes) {
      traiterLigne(ligne);
    }

    /* ===================================
       CONTRÔLE DES DIX SCÈNES
    =================================== */

    if(compteurScenes !== 10) {

      console.warn(
        "Nombre de scènes détectées :",
        compteurScenes,
        "— dix scènes attendues."
      );

    }

  }

  catch(erreur) {

    manuscrit.replaceChildren();

    manuscrit.appendChild(
      creer(
        "p",
        "Le manuscrit n'a pas pu être ouvert. Vérifiez que Claire_fontaine_scen_site.txt se trouve dans le même dossier GitHub que cette page.",
        "etat"
      )
    );

    console.error(erreur);

  }

})();

</script>

</body>
</html>
